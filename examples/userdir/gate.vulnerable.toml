[project]
name = "userdir (vulnerable variant)"
spec_module = "UserdirSpec"    # an agent module must refine this module

[agent]
files = ["examples/userdir/src/AppVulnerable.dfy"]   # the only files the agent writes
dirs = ["examples/userdir/src"]            # includes must stay in frozen files or here

[verify]
files = ["examples/userdir/src/AppVulnerable.dfy"]

[build]
entry = "examples/userdir/src/AppVulnerable.dfy"
out = "build/vulnerable/app"

[tests]
commands = ["python3 -I examples/userdir/tests/test_userdir.py --build build/vulnerable/app-py"]
